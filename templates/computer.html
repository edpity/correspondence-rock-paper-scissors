<!DOCTYPE html>
<html>
 <head>
  <style>
   html, body {
    height: 100%;
    margin: 0;
   }
   .parent {
     width: 100%;
     height: 100%;
     display: table;
     text-align: center;
   }
   .parent > .child {
     display: table-cell;
     vertical-align: middle;
   }
   body {
    background: radial-gradient(#ff99cc 0%, #000000 100%);
   }
   p.a {
    font: 48px Courier, sans-serif;
   }
   p.b {
    font: 18px Courier, sans-serif;
   }
   .emptyCircle {
	  margin: auto;
    border-radius: 50%;
	  height: 20px;
	  width: 20px;
	  border: 2px solid red;
	}
   .fullCircle {
	  margin: auto;
    border-radius: 50%;
	  height: 20px;
	  width: 20px;
	  border: 2px solid red;
	  background-color: #f00;
	}		
  </style>
  <title>correspondence rock paper scissors</title> 
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script> 
 </head>
 <body>
  <section class="parent">
   <div class="child">
   <br>
   <button class="difficulty" value="1" onclick="setDifficulty(event)">Easy</button>
   <button class="difficulty" value="2" onclick="setDifficulty(event)">Medium</button>
   <button class="difficulty" value="3" onclick="setDifficulty(event)">Hard</button>
   <br>
   <br>
   <br>
   <br>
   <br>
   <br>
   <br>
    <button class="button" value="1" onclick="getChoice(event)">Rock</button>
    <button class="button" value="2" onclick="getChoice(event)">Paper</button>
    <button class="button" value="3" onclick="getChoice(event)">Scissors</button>
	<p id="output"></p>
   </div>
  </section>
  <script>
      var difficulty = "2";
      var choice = "1";

			function setDifficulty(d) { 
				difficulty = d.target.value;
      }

      function getChoice(c) {
        choice = c.target.value;
        var length = Math.random() * 10000;
        setTimeout(gameLogic, length);
      }

      function gameLogic() {
        if (difficulty == "1") {
          if (choice == "1") {
            document.getElementById('output').innerHTML = "Rock beats scissors! You win.";
          }
          else if (choice == "2") {
            document.getElementById('output').innerHTML = "Paper beats rock! You win.";
          }
          else if (choice == "3") {
            document.getElementById('output').innerHTML = "Scissors beats paper! You win.";
          }
        }
        else if (difficulty == "2") {
          if (choice == "1") {
            document.getElementById('output').innerHTML = "Draw!";
          }
          else if (choice == "2") {
            document.getElementById('output').innerHTML = "Draw!";
          }
          else if (choice == "3") {
            document.getElementById('output').innerHTML = "Draw!";
          }
        }
        else if (difficulty == "3") {
          if (choice == "1") {
            document.getElementById('output').innerHTML = "Paper beats rock! You lose.";
          }
          else if (choice == "2") {
            document.getElementById('output').innerHTML = "Scissors beats paper! You lose.";
          }
          else if (choice == "3") {
            document.getElementById('output').innerHTML = "Rock beats scissors! You lose.";
          }
        }
      }
      </script>
    </body>
</html>
